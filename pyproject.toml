[project]
name = "blind-eval-system"
version = "0.3.0"
description = "图像盲评系统 - 盲测评测平台"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "sqlalchemy==2.0.35",
    "pymysql==1.1.1",
    "cryptography==43.0.0",
    "python-multipart==0.0.9",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "pillow==10.4.0",
    "numpy==2.1.0",
    "bcrypt<4.0.0",
]

[project.scripts]
serve = "uvicorn:main"
